<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>Student Grade Tracker</title>
  
</head>
<body>
  <h2>Student Grade Tracker</h2>

  <div class="form-group">
    <input type="text" id="studentName" placeholder="Student name" />
    <input type="number" id="studentScore" placeholder="Score (0-100)" />
    <button id="addBtn" class="btn-add">Add</button>
    <button id="clearBtn" class="btn-clear">Clear</button>
  </div>

  <div id="errorBox" class="error-msg"></div>

  <ul id="studentList"></ul>

  <div class="summary-card" id="summaryBox">
    Total Students: 0 | Class Average: 0.0
  </div>

  <script src="app.js"></script>
</body>
</html>
