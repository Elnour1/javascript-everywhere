<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Task Manager — Accessible Dashboard</title>
</head>
<body>
  <header>
    <h1>Task Management System</h1>
    <p>Organize, track, and prioritize your daily engineering tasks.</p>
  </header>

  <main>
    <!-- Live Announcements & Status Area -->
    <div id="live-region" role="status" aria-live="polite">
      System ready.
    </div>

    <!-- Section 1: Create Task Form -->
    <section aria-labelledby="heading-create">
      <h2 id="heading-create">Add New Task</h2>

      <!-- Form Error Container -->
      <div id="form-error" role="alert" aria-live="assertive" style="display: none; color: red;">
        <!-- Error text injected here dynamically -->
      </div>

      <form id="create-task-form">
        <div class="form-group">
          <label for="task-title">Task Title</label>
          <input type="text" id="task-title" name="title" required minlength="2">
        </div>

        <div class="form-group">
          <label for="task-priority">Priority Level</label>
          <select id="task-priority" name="priority">
            <option value="low">Low</option>
            <option value="normal" selected>Normal</option>
            <option value="high">High</option>
          </select>
        </div>

        <div>
          <!-- Only submit button in form -->
          <button type="submit">Create Task</button>
        </div>
      </form>
    </section>

    <!-- Section 2: Task List -->
    <section aria-labelledby="heading-tasks">
      <h2 id="heading-tasks">Active Tasks</h2>

      <!-- The dynamic container rendered exclusively by main.ts -->
      <div id="task-list-container"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Task Manager Project.</p>
    <nav aria-label="Footer Navigation">
      <a href="layout-lab.html">Explore Layout Lab (No JavaScript)</a>
    </nav>
  </footer>

  <script type="module" src="./src/client/main.ts"></script>
</body>
</html>
