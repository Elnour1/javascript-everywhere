<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typed Grade Report — Student Portal</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    h1 { margin-bottom: 0.5rem; }
    .status { padding: 0.75rem 1rem; border-radius: 6px; margin: 1rem 0; font-weight: 500; }
    .status.idle { background: #f3f4f6; color: #374151; }
    .status.loading { background: #e0f2fe; color: #0369a1; }
    .status.loaded { background: #dcfce7; color: #15803d; }
    .status.failed { background: #fee2e2; color: #b91c1c; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #e5e7eb; padding: 0.5rem 0.75rem; text-align: left; }
    th { background: #f9fafb; }
    form { display: flex; gap: 0.5rem; margin: 1.5rem 0; flex-wrap: wrap; }
    input, button { padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; border-radius: 4px; font-size: 1rem; }
    button { cursor: pointer; background: #2563eb; color: white; border: none; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    .summary { margin-top: 1.5rem; padding: 1rem; background: #fafafa; border-left: 4px solid #2563eb; }
  </style>
</head>
<body>
  <h1>Student Grade Report</h1>
  <p>Track 1 — Typed DOM Browser Application</p>

  <div style="margin: 1rem 0;">
    <button id="load-btn" type="button">Load Students</button>
  </div>

  <form id="add-form">
    <input id="student-name" type="text" placeholder="Student name" required />
    <input id="student-score" type="number" placeholder="Score (0-100)" min="0" max="100" required />
    <button id="add-btn" type="submit">Add Student</button>
  </form>

  <div id="status-box" class="status idle">Ready to load students.</div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Score</th>
        <th>Grade</th>
        <th>Attendance</th>
      </tr>
    </thead>
    <tbody id="student-table-body"></tbody>
  </table>

  <div id="summary-box" class="summary" style="display: none;"></div>

  <script type="module" src="./dist/main.js"></script>
</body>
</html>
